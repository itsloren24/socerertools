a { color: var(--link); } a:hover { color: var(--link-hover); }

      if (el.localName === 'textarea' || (el.localName === 'input' && t !== 'checkbox' && t !== 'radio')) return 'input';
    }
    return n;
  }

  function build(srcParent, dest, scope) {
    var kids = srcParent.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (n.nodeType === 3) { dest.appendChild(document.createTextNode(n.data.indexOf('{{') > -1 ? interp(n.data, scope) : n.data)); continue; }
      if (n.nodeType !== 1) continue;
      if (n.localName === 'template' && n.dataset.sc === 'for') {
        var list = whole(n.getAttribute('list') || '', scope).v, as = n.getAttribute('as') || 'item';
        if (Array.isArray(list)) list.forEach(function (item, idx) { var sc = Object.assign({}, scope); sc[as] = item; sc.$index = idx; build(n.content, dest, sc); });
        continue;
      }
      if (n.localName === 'template' && n.dataset.sc === 'if') {
        if (whole(n.getAttribute('value') || '', scope).v) build(n.content, dest, scope);
        continue;
      }
      var el = n.namespaceURI === 'http://www.w3.org/1999/xhtml' ? document.createElement(n.localName) : document.createElementNS(n.namespaceURI, n.localName);
      var pendingValue, hasValue = false, checked;
      for (var a = 0; a < n.attributes.length; a++) {
        var name = n.attributes[a].name, val = n.attributes[a].value;
        if (name.indexOf('hint-') === 0) continue;
        if (/^on[a-z]+$/.test(name)) {
          var h = whole(val, scope).v;
          if (typeof h === 'function') el.addEventListener(evtName(name, n), h);
          continue;
        }
        var w = whole(val, scope);
        if (name === 'value') { hasValue = true; pendingValue = w.hit ? w.v : val; continue; }
        if (name === 'checked') { checked = w.hit ? !!w.v : true; continue; }
        if (w.hit) { if (w.v === false || w.v == null) continue; el.setAttribute(name, String(w.v)); }
        else el.setAttribute(name, val.indexOf('{{') > -1 ? interp(val, scope) : val);
      }
      build(n, el, scope);
      dest.appendChild(el);
      if (hasValue) el.value = pendingValue == null ? '' : pendingValue;
      if (checked !== undefined) el.checked = checked;
    }
  }

  function render() {
    if (!current) return;
    var inst = instances[current];
    var fields = root.querySelectorAll('input,textarea,select'), active = document.activeElement, idx = -1, s0, s1;
    for (var i = 0; i < fields.length; i++) if (fields[i] === active) idx = i;
    if (idx > -1) { try { s0 = active.selectionStart; s1 = active.selectionEnd; } catch (e) {} }
    var frag = document.createDocumentFragment();
    build(document.getElementById('tpl-' + current).content, frag, inst.renderVals() || {});
    root.replaceChildren(frag);
    if (idx > -1) {
      var f = root.querySelectorAll('input,textarea,select')[idx];
      if (f) { f.focus({ preventScroll: true }); try { if (s0 != null) f.setSelectionRange(s0, s1); } catch (e) {} }
    }
  }

  var bySlug = {};
  Object.keys(SCREENS).forEach(function (k) { bySlug[SCREENS[k].slug] = k; });

  function show(stem) {
    if (!SCREENS[stem]) stem = 'Main';
    if (!instances[stem]) { var C = SCREENS[stem].make(DCLogic); instances[stem] = new C({}); }
    var first = current !== stem;
    current = stem;
    document.title = SCREENS[stem].title === 'SorcererTools home' ? 'SorcererTools' : SCREENS[stem].title + ' · SorcererTools';
    render();
    if (first) window.scrollTo(0, 0);
  }
  function fromHash() { show(bySlug[location.hash.replace('#', '')] || 'Main'); }

  root.addEventListener('click', function (e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    var m = /^\/?([A-Za-z0-9_-]+)\.dc\.html$/.exec(href);
    if (m) {
      e.preventDefault();
      var slug = SCREENS[m[1]] ? SCREENS[m[1]].slug : 'home';
      if (location.hash === '#' + slug) show(m[1]); else location.hash = slug;
    } else if (href === '#') e.preventDefault();
  });
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();

</script>
